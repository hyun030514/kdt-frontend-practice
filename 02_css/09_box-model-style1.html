<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 100px;
            height: 100px;
            border-width: 3px;
        }

        .border-test1 {
            border-style: none;
        }
         .border-test2{
            border-style: hidden;
            box-shadow: 5px 5px 3px 2px gray;
         }
          .border-test3 {
            border-style: dotted;
          }
          .border-test4 {
            border-style: dashed;
          }
          .border-test5 {
            border-style: double;
            border-color: blueviolet;
          }
          .border-test6 {
            border-style: groove;
            border-top-left-radius: 50px;
            border-top-right-radius: 50px;
            border-bottom-left-radius: 50px;
            border-bottom-right-radius: 50px;
          }
          .border-test7 {
            border-style: inset;
            border-bottom-right-radius: 50px;
          }
          .border-test8 {
            border-style: outset;
          }
          .border-test9 {
            border-style: ridge;
            box-shadow: 5px 5px 3px 2px gray;
          }
          .border-test10 {
            border-style: solid;
          }
    </style>
</head>
<body>
    <!--
        ‼️ Box 기본 구조
        ┌-------------------------------------┐
        |           margin(외부여백)          |
        |  ┌-------------------------------┐  |
        |  |        border(테두리)         |  |
        |  |  ┌-------------------------┐  |  |
        |  |  |     padding(내부여백)   |  |  |
        |  |  |  ┌-------------------┐  |  |  |
        |  |  |  |  content(내용물)  |  |  |  |
        |  |  |  └-------------------┘  |  |  |
        |  |  └-------------------------┘  |  |
        |  └-------------------------------┘  |
        └-------------------------------------┘

        * 한 요소의 전체 크기는 content + padding + border을 합산한 사이즈입니다.

        📌 CSS 박스 모델 관련 스타일 속성
        1. width, height
            1) 콘텐츠의 너비와 높이를 지정하는 속성입니다.
            2) px, % 등의 단위를 사용합니다. (%는 부모 요소의 크기를 기준으로)
            3) 인라인 요소는 크기를 지정할 수 없습니다.
        2. border
            1) 테두리의 두께, 종류, 색상을 지정하는 속성입니다.
            2) 테두리의 두께는 기본적으로 box 크기에 영향을 미칩니다.
            3) 종류 : solid, dotted, dashed, double, groove, ridge, inset, outset 등
        3. padding
            1) 콘텐츠와 테두리 사이의 내부 여백을 지정하는 속성입니다.
            2) px, % 등의 단위를 사용합니다.
            3) 내부 여백은 기본적으로 box 크기에 영향을 미칩니다.
        4. margin
            1) 테두리 바깥쪽 여백을 지정하는 속성입니다.
            2) 타 요소간의 간격을 띄우고자할 때 주로 사용
            3) 외부 여백은 기본적으로 box 크기에 영향을 미치지 않습니다.
        5. box-sizing
            1) 요소의 크기 계산 방식을 지정하는 속성입니다.
            2) content-box, padding-box, border-box 등의 값을 사용합니다.
    -->
        <h1>테두리 스타일</h1>
        <div class="border-test1"></div>
        <div class="border-test2"></div>
        <div class="border-test3"></div>
        <div class="border-test4"></div>
        <div class="border-test5"></div>
        <div class="border-test6"></div>
        <div class="border-test7"></div>
        <div class="border-test8"></div>
        <div class="border-test9"></div>
        <div class="border-test10"></div>
</body>
</html>
