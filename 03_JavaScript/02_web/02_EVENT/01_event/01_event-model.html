<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
    📌 이벤트 (Event)
    1. DOM 객체에서 발생하는 어떤 시그널을 의미함 
    2. 시스템에 일어나는 사건(Action) 또는 발생(Occurrence)을 의미함 
    3. 주요 이벤트 발생 방식
        1) 사용자의 액션에 의해서 발생(클릭, 키보드 입력, 마우스 움직임 등)
        2) API의 의해 이벤트가 생성되는 경우

    📌 이벤트 핸들러 (Event Handler)
    1. 이벤트가 발생했을 때 동작하는 함수(Function)를 이벤트 핸들러(Event Handler) 라고 함 
        1) 이벤트 핸들러 : 이벤트가 발생하면 실행되는 코드
        2) 이벤트 리스너 : 특정 이벤트가 발생했는지 감지하는 역할
    2. 이벤트 핸들러가 동작할 때는 발생한 이벤트에 대한 각종 정보가 담긴 "이벤트 객체(Event Object)"가 인자로 자동 전달됨
    3. 이벤트가 발생했을 때 이벤트 핸들러를 할당하는 방법을 "이벤트 모델(Event Model)"이라고 함
        1) 고전 이벤트 모델
        2) 표준 이벤트 모델
        3) 인라인 이벤트 모델
-->


<!-- 
    * 고전 이벤트 모델 
    1. 이벤트 할당을 위해서 이벤트 핸들러 프로퍼티(Event Handler Property)를 활용하는 방법
    2. 이벤트 종류 앞에 "on" 키워드를 붙이면 이벤트 핸들러 프로퍼티가 완성됨 
    ex) onclick, onkeydown, onsubmit, onfocus 등
    3. 하나의 이벤트에 하나의 이벤트 핸들러를 할당할 수 있음 (마지막에 등록한 이벤트 핸들러만 동작함)
    4. 이벤트 할당 방식 예시
        1) 익명 함수
            요소.onclick = function(){ }
        2) 화살표 함수
            요소.onclick = () => { }
        3) 기명 함수
            function eventHandler(){  }
            요소.onclick = eventHandler;
-->

<h2>고전 이벤트 모델 방식</h2>

<button id="btn1">고전이벤트모델1</button>
<button id="btn2">고전이벤트모델2</button>
<button id="btn3">고전이벤트모델3</button>

<script>
    const btn1 = document.querySelector("#btn1");
    const btn2 = document.querySelector("#btn2");
    const btn3 = document.querySelector("#btn3");

    // 익명함수
    btn1.onclick = function() {       // 이벤트 헨들러
        console.log('btn1 클릭');
    };

    btn1.onclick = function() {        // 마지막에 대입한 이벤트 헨들러만 존재
        alert('btn1 클릭!!');
    }

    // 화살표 함수
    btn2.onclick = () => {
        console.log('btn2 클릭');
        btn1.onclick = null;            // 이벤트 헨들러 없애기
    };

    // 기명 함수
    function action() {
        console.log('action 함수 실행');
    }

    btn3.onclick = action;               // 함수 참조
    // action();                            // 함수 호출 - 바로 실행 -> 반환값이 onclick 들어감
</script>


<!-- 
    * 인라인 이벤트 모델 
    1. HTML 요소에 직접 이벤트 핸들러 속성(Event Handler Attribute) 등록하고 이벤트 핸들러를 호출하는 방식
    2. 이벤트 핸들러 작성시 주로 기명 함수를 사용함 
    3. 이벤트 할당 방식 예시
    <button type="button" onclick="inline()">
    function inline(){

    }
-->


<hr>


<h2>인라인 이벤트 모델 방식(이벤트 핸들러 어트리뷰트 방식)</h2>

<button onclick="inlineModel();">인라인이벤트모델</button>

<script>
    function inlineModel() {
        console.log('inlineModel 함수 실행');
    }
</script>

<!-- 
    * 표준 이벤트 모델 
    1. W3C에서 공식적으로 지정한 웹 표준의 이벤트 모델 방식 (최신 브라우저에서 다 지원)
    2. EventTarget 인터페이스의 addEventListener() 메소드를 호출하는 방식
    3. 하나의 이벤트에 여러 개의 이벤트 리스너를 할당할 수 있음 
    4. 이벤트 할당 방식 예시
        1) 익명 함수
            요소.addEventListener('click', function(){ })
        2) 화살표 함수
            요소.addEventListener('click', () => { })
        3) 기명 함수
            function eventHandler(){ }
            요소.addEventListener('click', eventHandler);
-->

<hr>

<h2>표준 이벤트 모델 방식</h2>

<button id="btn4">표준이벤트모델1</button>
<button id="btn5">표준이벤트모델2</button>
<button id="btn6">표준이벤트모델3</button>

<script>
    const btn4 = document.querySelector("#btn4");
    const btn5 = document.querySelector("#btn5");
    const btn6 = document.querySelector("#btn6");

    // addEventListener 방식
    btn4.addEventListener('click', function() {
        console.log('btn4 클릭');
    })

    // 또 다른 addEventListener 등록 -> 이벤트 여러 개 등록 가능
    btn4.addEventListener('click', function() {
        alert('btn4 클릭');
    })

    // 고전 이벤트 모델을 addEventListener와 혼합 사용 시 addEventListener 등록 이벤트는 그대로 실행됨.
    btn4.onclick = function() {
        console.log('onclick 방식 이벤트 등록');
    }

    // 화살표 함수
    // mouseenter => 자기 자신한테만 이벤트 적용
    btn5.addEventListener('mouseenter', () => {
        console.log('btn5 마우스 들어감');
    })

    // 기명 함수
    function action() {
        console.log('action 함수 실행');
    }

    btn6.addEventListener('dblclick', action);

    // 참조가 동일한 이벤트 헨들러를 중복으로 등록하면 하나의 핸들러만 등록된다.
    // mouseover -> 자식 요소에도 이벤트 전파
    const handleMouseOver = () => console.log('button mouseover');
    btn6.addEventListener('mouseover', handleMouseOver);
    btn6.addEventListener('mouseover', handleMouseOver);

</script>

<!--
    * 이벤트 핸들러 제거
    EventTarget.prototype.removeEventListener 메서드를 통해 addEventListener 메서드로 등록한 이벤트 핸들러를 제거한다. 
    removeEventListener 메서드에 전달하는 인수는 addEventListener 메서드와 동일하며, 
    전달한 인수가 일치하지 않을 경우 이벤트 핸들러는 제거되지 않는다. 
-->

<hr>

<h2>이벤트 핸들러 제거</h2>

<button id="btnremove1">클릭해보세요</button>
<button id="btnremove2">더블클릭해보세요</button>

<script>
    const $btnRemove1 = document.getElementById('btnremove1');
    const $btnRemove2 = document.getElementById('btnremove2');

    const handleClick =  () => alert('클릭했니?');

    $btnRemove1.addEventListener('click', handleClick);

    $btnRemove1.removeEventListener('click', handleClick);

    $btnRemove1.addEventListener('mouseover', () => alert('마우스 올렸다!'));

    // 참조할 수 없는 콜백함수(주로 익명함수)를 넘기면 제거가 불가능하다
    // $btnRemove1.removeEventListener('mouseover', () => alert('마우스 올렸다!'));  
    //호출할 때마다 새로운 함수 만들어주기 때문에 참조할 수 있는 함수 없어서 removeEventListener 해도 안 없어짐

    const handleDblClick = () => alert('더블클릭했니?');

    // 이벤트 핸들러 프로퍼티 방식 -> 고전 이벤트 모델 방식
    $btnRemove2.ondblclick = handleDblClick;

    // 고전 이벤트 모델 방식이라 removeEventListener 동작 X -> 지우고 싶으면 null 쓰기
    // addEventListener 이면 remove 해서 지워도 됨!
    $btnRemove2.removeEventListener('dblclick', handleDblClick);

    $btnRemove2.ondblclick = null;
</script>
</body>
</html>
