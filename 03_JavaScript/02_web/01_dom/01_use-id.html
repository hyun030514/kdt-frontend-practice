<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .area {
            width: 100px;
            height: 100px;
            border: 1px solid lightgray;
        }
    </style>
</head>

<body>
    <pre>
        <b>Document.prototype.getElementById 메서드는 인수로 전달한 
            id 어트리뷰트 값을 갖는 하나의 요소 노드만 탐색하여 반환한다.
        </b>
        문서 내에 중복 된 id값을 갖는 HTML 요소가 여러 개 존재하더라도
        에러가 발생하지는 않지만 해당 id 값을 갖는 첫 번째 요소 노드만 반환한다.
    </pre>
    <div id="area1" class="area">
        div 영역
        <p id="area2">p 영역</p>
    </div>
    <div id="area1" class="area">
        div 영역
    </div>
</body>

<script>
    // 요소 노드 취득
    const $elemet = document.getElementById('area1');
    console.log($elemet);
    $elemet.style.backgroundColor = 'skyblue';

    // 1) id 속성 값을 그대로 취득하여 전역변수를 이용한 접근도 가능하다.
    area2.style.backgroundColor = 'blue';
    // 2) 하지만 id 값과 동일한 이름의 전역변수가 있을 경우 이름 충돌이 있어 지양하는 것이 좋다. 
    // let area2 = 10; 
    
    const $noElement = documnet.getElementById('area3');
    console.log($noElement); //null 반환
</script>

</html>
