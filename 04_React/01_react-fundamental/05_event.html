<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <title>Document</title>
</head>

<body>
  <!--
    1. React Event 개념
      1) 이벤트는 사용자가 웹 브라우저에서 DOM 요소와 상호작용할 때 발생하는 사건(클릭, 입력, 마우스 이동 등)을 의미합니다. 
      2) 리액트는 자체적인 합성 이벤트 시스템을 사용하여 브라우저 호환성과 성능을 높이고, 개발자가 일관된 방식으로 이벤트를 처리할 수 있게 해줍니다.


    2. React Event 주요 특징
      1) 이벤트 속성 이름 표기법
        (1) HTML에서는 소문자(onclick, onchange)를 사용합니다.
        (2) 리액트에서는 camelCase 방식(onClick, onChange)으로 작성합니다.
      2) 이벤트 핸들러 전달 방식
        (1) 이벤트 핸들러는 이벤트 발생 시 실행할 코드를 작성해 놓은 함수입니다.
        (2) 리액트에서는 함수를 중괄호({})로 전달합니다.
        (3) 함수명 뒤에 괄호를 붙이지 않고 함수 참조만 전달해야 합니다. 괄호를 붙이면 즉시 실행됩니다.
        (4) 예시
          // 비교적 간단한 이벤트 핸들러 함수를 작성할 때 사용
          <button onClick={(e) => {실행내용}}>클릭</button>

          // 비교적 복잡한 이벤트 핸들러 함수를 작성할 때 사용
          const handleClick = (e) => {
            // 실행내용 
          }
          <button onClick={handleClick}>클릭</button>

      3) 이벤트 객체
        (1) 이벤트가 발생하면 이벤트 핸들러 함수의 첫 번째 인자로 이벤트 객체가 전달됩니다.
        (2) 이벤트 객체는 이벤트가 발생한 요소, 입력 값 등 다양한 정보를 담고 있습니다.
        (3) 자식요소의 이벤트가 상위 요소로 전파되는 이벤트전파(이벤트버블링)을 막고자할 경우 stopPropagation() 메소드를 사용합니다.
        (4) 이벤트 객체의 preventDefault() 메소드를 이용해 기본 이벤트(예. <a>, <form> 등) 실행을 취소할 수 있습니다.
      4) props로 이벤트 핸들러 전달
        (1) 이벤트 핸들러도 props로 자식 컴포넌트에 전달할 수 있습니다.
  -->

  <div id="root1"></div>
  <script type="text/babel">
    function App() {
      return (
        <>
          <button onClick={() => alert('첫 번째 버튼!!!')}>첫 번째 버튼</button>
        </>
      )

    }

    ReactDOM.createRoot(document.getElementById('root1')).render(<App />);

  </script>
  <hr>

  <div id="root2"></div>
  <script type="text/babel">
    function App() {

      // 이벤트 핸들러 함수 정의
      const handleClick = () => {
        alert("두 번재 버튼!!!!!!!!");
      }

      return (
        <>
          <button onClick={handleClick}>두 번째 버튼</button>
        </>
      )

    }

    ReactDOM.createRoot(document.getElementById('root2')).render(<App />);

  </script>
</body>

</html>
