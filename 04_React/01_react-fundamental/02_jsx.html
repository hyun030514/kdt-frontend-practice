<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
</head>

<body>

    <!--
    1. babel.min.js
      1) https://babeljs.io/setup#installation
      2) Babel(바벨)의 브라우저용 독립 실행 파일을 불러오는 역할을 합니다.
      3) Babel은 최신 문법(화살표 함수, 클래스, 템플릿 리터럴 등)이나 React의 JSX 문법, TypeScript 등을 브라우저에서 바로 사용할 수 있도록, 실시간으로 ES5 이하의 자바스크립트 코드로 변환해줍니다.
      4) @babel/standalone은 Node.js나 빌드 도구 없이, 브라우저 환경에서 <script type="text/babel">로 작성된 코드를 읽어 즉석에서 변환·실행할 수 있게 해줍니다. 개발·학습 환경이나 간단한 데모에서 주로 사용됩니다.
      5) Babel을 통해 변환된 코드는 다양한 브라우저(특히 구형 브라우저)에서도 동일하게 동작할 수 있습니다. 즉, 브라우저 호환성을 높여줍니다.
        
    2. JSX
      1) JSX(JavaScript XML)는 React에서 UI를 정의하기 위해 사용하는 자바스크립트의 확장 문법입니다. 
      2) HTML과 매우 유사한 구조를 자바스크립트 코드 안에서 직접 사용할 수 있게 해주며, 가독성과 직관성을 높여줍니다.
      3) JSX는 브라우저에서 직접 실행되지 않고, Babel 등의 트랜스파일러에 의해 React의 createElement 함수 호출로 변환되어 실행됩니다.
      4) JSX 문법
        (1) HTML과 유사한 구조
          ① JSX는 HTML과 거의 비슷한 문법을 사용하지만, 자바스크립트 코드 안에서 작성됩니다.
          ② 예시
            const element = <h1>Hello, World!</h1>;
        (2) 단일 루트 요소 필요
          ① JSX에서 여러 태그를 반환할 때 반드시 하나의 부모(루트) 요소로 감싸야 합니다.
          ② 최상위 Node로 사용할 태그가 없는 경우에는 React가 지원하는 Fragment를 사용할 수 있습니다. (<React.Fragment></React.Fragment> 또는 <></>)
          ③ 예시
            return (
              <div>
                <h1>Hello, World!</h1>
                <p>Nice to meet you!</p>
              </div>
            );
        (3) 자바스크립트 표현식 삽입
          ① JSX 내부에서 중괄호 {}를 사용해 자바스크립트 변수, 연산, 함수 호출, 주석 등을 삽입할 수 있습니다.
          ② 예시
            const numA = 1, numB = 2;
            <h1>{numA} + {numB} = {numA + numB}</h1>    
        (4) 속성 작성
          ① JSX의 속성은 HTML과 비슷하지만, 자바스크립트 예약어와 충돌하지 않도록 일부 속성은 변경된 이름을 사용합니다.
          ② 예시
            - class   -> className
            - for     -> htmlFor
            - onclick -> onClick (이벤트 속성: 기본 소문자 조합에서 camelCase 방식으로 변경)
        (5) 닫는 태그 필수
          ① 모든 태그는 반드시 닫아야 합니다. 셀프 클로징 태그도 /를 붙여 닫아야 합니다.
          ② 예시
            - <br />, <img />, <input /> 등
        (6) 조건부 렌더링
          ① 삼항 연산자, 논리 연산자(&&) 등을 사용해 조건에 따라 다른 내용을 렌더링할 수 있습니다.
          ② 예시
            { isLoggedIn ? <LogoutButton /> : <LoginButton /> }
        (7) 스타일 적용
          ① 인라인 스타일은 객체 형태로 style 속성에 전달합니다.
          ② 기존 dash-case(kebab-case) 형식의 CSS 속성명을 camelCase 방식으로 변경합니다.
          ③ 예시
            <div style={{ color: 'red', backgroundColor: 'yellow' }}>Hello</div>
        (8) 객체 직접 출력 불가
          ① JSX에서는 객체 자체를 직접 렌더링할 수 없어 문자열로 변환해야 합니다.
          ② 객체의 속성에 접근하는 것은 가능합니다.
          ③ 예시
            - 객체를 문자열로 변환
              { JSON.stringify(obj) }
            - 객체의 속성에 접근
              { obj.a }
  -->
    <div id="root1"></div>
    <script type="text/babel">
        const h1Element = <h1>Hello world</h1>;
        // cosnt h1Element = React.createElement('h1', {}, 'Hello world'); 이 코드를 변환한거임

        ReactDOM.createRoot(document.getElementById('root1')).render(h1Element);
    </script>

    <hr>

    <div id="root2"></div>
    <script type="text/babel">
        // 최상위 엘리먼트가 2개 이상이면 에러 발생 (하나의 돔 트리만 생성해야한다.) 만약 두개 쓰고 싶으면 또 div로 묶어야됨.
        // 근데 div 많이 쓰는거 안 좋으니까 <React.Fragment> 사용!!
        const divElement = 
        <> {/* <React.Fragment> 축약*/}
            <div>hello world</div>
            <div>nice to meet you</div>
        </>

        ReactDOM.createRoot(document.getElementById('root2')).render(divElement);
    </script>

    <div id="root3"></div>
    <script type="text/babel">

        function formatName(user) {
            return `${user.lastName} ${user.firstName}`;
        }
        const user = {
            firstName: 'gildong',
            lastName: 'hong'
        };

        const element = <h1>hello, {formatName(user)}</h1>
        ReactDOM.createRoot(document.getElementById('root3')).render()
    </script>

    <div id="root4"></div>
    <script type="text/babel">

        const inputElement = <input type='text' />;

        ReactDOM.createRoot(document.getElementById('root4')).render(inputElement);
    </script>

    <div id="root5"></div>
    <script type="text/babel">

        // 삼항연산자 / 논리 연산자를 통한 조건부 렌더링
        const score = 100;

        const resultMessage = score >= 60
        ? <span>합격</span>
        : <span>불합격</span>

        const bonusMessage = score === 100 && <span>만점입니다!</span>;

        ReactDOM.createRoot(document.getElementById('root5')).render();
    </script>

    <hr>

<div id="root6"></div>
<script type="text/babel">

    const style = {
        backgroundColor : 'black',
        color : 'white',
        cursor : 'pointer',
        textAlign : 'center',
        padding : 20            // 숫자만 사용 가능 단위 쓰고 싶으면 "20px" 이렇게 문자열로 쓰기 인라인으로 선언
    };

    const styleElement = 
    <>

        <h1 style={style}>hello world</h1>
        <h3>inline styling test</h3>

    </>

    ReactDOM.createRoot(document.getElementById('root6')).render(styleElement);
</script>

<hr>

<div id="root7"></div>
<script type="text/babel">

    const book = {
        title : '어린왕자',
        author: '생택쥐베리'
    };

    // const bookElement = <div>{ JSON.stringify(book) } </div>

    const bookElement = <ul>
        <li>{book.title}</li>
        <li>{book.author}</li>
    </ul>
    ///⭐️⭐️⭐️⭐️

    ReactDOM.createRoot(document.getElementById('root7')).render(bookElement);
</script>

</body>

</html>
